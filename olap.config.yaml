version: 1
adapters:
  preferred: grok
  fallback: codex
  options:
    grok:
      model: grok-composer-2.5-fast
      extra_args: []
    claude:
      model: sonnet
      extra_args: []
    gemini:
      model: gemini-2.5-pro
      extra_args: []
    codex:
      model: gpt-5-codex
      extra_args: []
    kiro:
      model: claude-opus-4.8
      extra_args: []
    opencode:
      model: opencode/claude-opus-4-8
      extra_args: []
    openrouter:
      model: anthropic/claude-sonnet-4
      extra_args: []
    ollama:
      model: qwen2.5-coder:7b
      extra_args: []
  capabilities:
    grok:
      planning: true
      review: true
      file_edits: true
      shell: true
      model_discovery: true
      local: false
      notes: General-purpose agentic CLI with JSON output.
    claude:
      planning: true
      review: true
      file_edits: true
      shell: true
      model_discovery: false
      local: false
      notes: Strong planning/review CLI; model list is usually configured externally.
    gemini:
      planning: true
      review: true
      file_edits: true
      shell: true
      model_discovery: false
      local: false
      notes: Large-context CLI; model list is usually configured externally.
    codex:
      planning: true
      review: true
      file_edits: true
      shell: true
      model_discovery: false
      local: false
      notes: Agentic coding CLI with explicit sandbox and approval controls.
    kiro:
      planning: true
      review: true
      file_edits: true
      shell: true
      model_discovery: true
      local: false
      notes: Kiro manages model selection and trusted tool scopes.
    opencode:
      planning: true
      review: true
      file_edits: true
      shell: true
      model_discovery: true
      local: false
      notes: OpenCode agentic CLI; use opencode/<model> for Zen subscriptions.
    openrouter:
      planning: true
      review: true
      file_edits: false
      shell: false
      model_discovery: true
      local: false
      notes: OpenRouter chat CLI; text-only orchestration via openrouter ask.
    ollama:
      planning: true
      review: true
      file_edits: false
      shell: false
      model_discovery: false
      local: true
      notes: Local text model adapter. Best for plan/review or custom text-only workflows.
roles:
  orchestrator:
    adapter: kiro
    model: claude-opus-4.8
    effort: default
  worker:
    adapter: grok
    model: grok-composer-2.5-fast
    effort: default
jobs:
  orchestrator:
    adapter: kiro
    model: claude-opus-4.8
    effort: default
  architect:
    adapter: kiro
    model: claude-opus-4.8
    effort: default
  reviewer:
    adapter: kiro
    model: claude-opus-4.8
    effort: default
  worker:
    adapter: grok
    model: grok-composer-2.5-fast
    effort: default
  qa:
    adapter: grok
    model: grok-composer-2.5-fast
    effort: default
orchestrator:
  enabled: true
  tick_interval_ms: 10000
  max_concurrent_agents: 4
  workspace_mode: worktree
ui:
  theme: mono
  mode: build
  banner: true
  confirm_before_run: true
access:
  approval: never
  sandbox: danger-full-access
  network: false
subagents:
  enabled: true
  max_parallel: 4
architect:
  output_budget_tokens: 4096
  context_pack_max_tokens: 32000
  review_schema_version: 1
  system_prompt_hint: Be concise. Follow each phase's output-format instructions exactly.
  require_valid_reviews: true
  iteration_timeout_ms: 600000
worker:
  max_iterations: 10
  iteration_timeout_ms: 300000
  stop_on_first_pass: true
  loop_policy: auto
cost:
  enabled: true
  currency: USD
  session_budget_usd: 0
  prices_per_million_tokens:
    grok:
      grok-composer-2.5-fast:
        input: 1.25
        output: 2.5
      grok-build:
        input: 1
        output: 2
      grok-code-fast-1:
        input: 0.2
        output: 1.5
      grok-3-mini:
        input: 0.3
        output: 0.5
    claude:
      sonnet:
        input: 3
        output: 15
      opus:
        input: 5
        output: 25
      haiku:
        input: 1
        output: 5
    gemini:
      gemini-2.5-flash:
        input: 0.3
        output: 2.5
      gemini-2.0-flash:
        input: 0.1
        output: 0.4
    codex:
      gpt-5-codex:
        input: 1.25
        output: 10
      gpt-5:
        input: 1.25
        output: 10
      o4-mini:
        input: 1.1
        output: 4.4
    kiro:
      claude-opus-4.8:
        input: 5
        output: 25
    opencode:
      opencode/claude-opus-4-8:
        input: 5
        output: 25
      opencode/gpt-5.3-codex:
        input: 1.75
        output: 14
    openrouter:
      anthropic/claude-sonnet-4:
        input: 3
        output: 15
    ollama:
      qwen2.5-coder:7b:
        input: 0
        output: 0
modules: []
validators:
  - name: typecheck
    command: npm run typecheck
  - name: test
    command: npm test
