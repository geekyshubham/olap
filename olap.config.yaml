version: 1
adapters:
  preferred: grok
  fallback: codex
  options:
    grok:
      model: grok-composer-2.5-fast
      extra_args: []
    claude:
      model: sonnet
      extra_args: []
    gemini:
      model: gemini-2.5-pro
      extra_args: []
    codex:
      model: gpt-5-codex
      extra_args: []
    kiro:
      model: ""
      extra_args: []
roles:
  orchestrator:
    adapter: grok
    model: grok-composer-2.5-fast
    effort: default
  worker:
    adapter: grok
    model: grok-composer-2.5-fast
    effort: default
ui:
  theme: mono
  mode: build
  banner: true
access:
  approval: on-failure
  sandbox: workspace-write
  network: false
subagents:
  enabled: false
  max_parallel: 1
architect:
  output_budget_tokens: 4096
  context_pack_max_tokens: 32000
  review_schema_version: 1
  system_prompt_hint: Return compact structured reviews. Avoid prose unless blocked.
  require_valid_reviews: true
  iteration_timeout_ms: 600000
worker:
  max_iterations: 3
  iteration_timeout_ms: 300000
  stop_on_first_pass: false
  loop_policy: auto
modules: []
validators:
  - name: typecheck
    command: npm run typecheck
  - name: test
    command: npm test
